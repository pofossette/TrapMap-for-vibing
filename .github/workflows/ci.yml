name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  fallow-push-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile

      - name: Enforce repository static quality
        run: pnpm check:fallow

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test
        env:
          NODE_ENV: test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trapmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Run PG integration tests
        run: pnpm exec vitest run packages/contracts/src/domain/task-queue.test.ts packages/host-distributed/src/shared/database-ownership.test.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/trapmap
          NODE_ENV: test

  doc-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:docs-drift
      - run: pnpm check:arch-freeze
      - run: pnpm check:deps
      - run: pnpm check:mermaid
      - run: pnpm check:structure
      - run: pnpm check:complexity
      - run: pnpm check:md-lint
      - run: pnpm check:links || true
      - run: pnpm check:stale-package-refs
      - run: pnpm exec fallow dead-code --boundary-violations --ci --fail-on-issues
      - run: pnpm exec fallow dead-code --unused-deps --ci --fail-on-issues
