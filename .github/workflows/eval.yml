name: Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/contracts/src/domain/evals/**'
      - 'evals/**'
      - 'packages/service-*/src/**'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Evaluation tier to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - core
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download latest baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: baseline-smoke
          path: reports/baselines/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke evaluation
        id: eval
        run: pnpm eval:ci
        env:
          NODE_ENV: test
          BASELINE_PATH: reports/baselines/baseline-smoke.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
          retention-days: 7

      - name: Comment regression summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const hasRegressions = '${{ steps.eval.outputs.has_regressions }}' === 'true';
            const regressedCount = '${{ steps.eval.outputs.regressed_count }}' || '0';
            const improvedCount = '${{ steps.eval.outputs.improved_count }}' || '0';

            const body = `## Evaluation Results

            - **Regressions detected**: ${hasRegressions ? '⚠️ Yes' : '✅ No'}
            - **Regressed slices**: ${regressedCount}
            - **Improved slices**: ${improvedCount}

            [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  eval-parity:
    runs-on: ubuntu-latest
    # Snapshot parity needs no API keys: it re-runs each suite bridge through
    # the promptfoo engine and asserts the per-case judgment matches the
    # committed snapshots in evals/promptfoo/snapshots/. Blocking on evals/**
    # PRs. The postgres service (with the vector extension) is only required by
    # the retrieval parity test; the other five run DB-free.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run snapshot parity tests
        run: |
          pnpm test:file -- evals/promptfoo/parity-agent-planning.test.ts
          pnpm test:file -- evals/promptfoo/parity-graph-extraction.test.ts
          pnpm test:file -- evals/promptfoo/parity-ingestion.test.ts
          pnpm test:file -- evals/promptfoo/parity-label-alignment.test.ts
          pnpm test:file -- evals/promptfoo/parity-summary.test.ts
          pnpm test:file -- evals/promptfoo/parity-retrieval.test.ts
        env:
          TRAPMAP_POSTGRES_COORDINATOR_URL: postgres://postgres:postgres@localhost:5432/postgres
          NODE_ENV: test
          VITEST_MAX_WORKERS: '1'
          VITEST_MIN_WORKERS: '1'

  eval-core-scheduled:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'core')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core evaluation
        run: pnpm eval:ci:core
        env:
          NODE_ENV: test
          WRITE_BASELINE: 'true'

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-core-report
          path: reports/
          retention-days: 30

      - name: Upload baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-core
          path: reports/baselines/
          retention-days: 90
