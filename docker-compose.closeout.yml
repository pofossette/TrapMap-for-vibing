# L3 verification overlay — replicas check (candidate-worker:2 / outbox-worker:2) and transport default pg
# Verify offline: pnpm exec tsx scripts/verify-l3-platform.ts --check compose-replicas --check transport-default
# Live smokes (CI_REQUIRED): TRAPMAP_TASK_TRANSPORT=amqp pg default unchanged; dual-DB via TRAPMAP_JOB_RUNTIME_DATABASE_URL
services:
  migration:
    container_name: !reset null
    restart: "no"

  gateway:
    container_name: !reset null
    ports: !override
      - "${TRAPMAP_CLOSEOUT_GATEWAY_PORT}:4000"
    environment:
      CONSUL_ENABLED: "false"
      TRAPMAP_TASK_TRANSPORT: postgres
    restart: "no"

  identity-access:
    container_name: !reset null
    environment:
      CONSUL_ENABLED: "false"
    restart: "no"

  knowledge-read:
    container_name: !reset null
    environment:
      CONSUL_ENABLED: "false"
    restart: "no"

  knowledge-write:
    container_name: !reset null
    environment:
      CONSUL_ENABLED: "false"
    restart: "no"

  candidate-worker:
    deploy:
      replicas: 2
    container_name: !reset null
    environment:
      CONSUL_ENABLED: "false"
      TRAPMAP_TASK_TRANSPORT: postgres
    depends_on:
      rabbitmq: !reset null
    restart: "no"

  governance-worker:
    container_name: !reset null
    environment:
      CONSUL_ENABLED: "false"
      TRAPMAP_TASK_TRANSPORT: postgres
    depends_on:
      rabbitmq: !reset null
    restart: "no"

  outbox-worker:
    deploy:
      replicas: 2
    container_name: !reset null
    environment:
      CONSUL_ENABLED: "false"
    restart: "no"

  cron-scheduler:
    container_name: !reset null
    environment:
      CONSUL_ENABLED: "false"
    restart: "no"

  postgres:
    container_name: !reset null
    ports: !reset []
    restart: "no"

networks:
  trapmap-distributed:
    external: false
    name: !reset null
