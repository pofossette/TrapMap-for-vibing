apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-worker
  namespace: trapmap
spec:
  replicas: 1
  selector:
    matchLabels: { app: outbox-worker }
  template:
    metadata:
      labels: { app: outbox-worker }
    spec:
      containers:
        - name: outbox-worker
          image: trap-map-host-distributed:latest
          args: ["--service", "job-runtime"]
          ports: [{ containerPort: 4006 }]
          envFrom:
            - configMapRef: { name: trapmap-config }
          readinessProbe:
            httpGet: { path: /ready, port: 4006 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /live, port: 4006 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-worker
  namespace: trapmap
spec:
  selector: { app: outbox-worker }
  ports: [{ port: 4006, targetPort: 4006 }]
