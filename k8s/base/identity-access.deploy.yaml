apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-access
  namespace: trapmap
spec:
  replicas: 1
  selector:
    matchLabels: { app: identity-access }
  template:
    metadata:
      labels: { app: identity-access }
    spec:
      containers:
        - name: identity-access
          image: trap-map-host-distributed:latest
          args: ["--service", "identity-access"]
          ports: [{ containerPort: 4001 }]
          envFrom:
            - configMapRef: { name: trapmap-config }
          readinessProbe:
            httpGet: { path: /ready, port: 4001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: 4001 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: identity-access
  namespace: trapmap
spec:
  selector: { app: identity-access }
  ports: [{ port: 4001, targetPort: 4001 }]
