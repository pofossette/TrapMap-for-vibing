services:
  server:
    image: trap-map-server:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: trapmap-server
    ports:
      - "4000:4000"
    volumes:
      - ./.data:/app/.data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - RUNTIME_MODE=${RUNTIME_MODE:-combined}
      - HOST=0.0.0.0
      - PORT=4000
      - TRAPMAP_DEPLOYMENT_PROFILE=${TRAPMAP_DEPLOYMENT_PROFILE:-team-monolith}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRAPMAP_SYSTEM_ADMIN_KEY=${TRAPMAP_SYSTEM_ADMIN_KEY:-}
      - TRAPMAP_DEPLOYMENT_PRESET=${TRAPMAP_DEPLOYMENT_PRESET:-}
      - TRAPMAP_TASK_TRANSPORT=${TRAPMAP_TASK_TRANSPORT:-postgres}
      - TRAPMAP_RABBITMQ_URL=${TRAPMAP_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - TRAPMAP_RABBITMQ_TASK_EXCHANGE=${TRAPMAP_RABBITMQ_TASK_EXCHANGE:-trapmap.tasks}
      - TRAPMAP_RABBITMQ_TASK_QUEUE=${TRAPMAP_RABBITMQ_TASK_QUEUE:-trapmap.default}
      - TRAPMAP_RABBITMQ_PREFETCH=${TRAPMAP_RABBITMQ_PREFETCH:-1}
      # AI Provider
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-}
      # Embedding Provider
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      # Database (set to use PostgreSQL; omit for JSON file storage)
      - TRAPMAP_DATABASE_URL=postgres://trapmap:${POSTGRES_PASSWORD:-trapmap}@postgres:5432/trapmap
      # Logging Configuration (Phase 24)
      - LOG_USER_OPS_ENABLED=${LOG_USER_OPS_ENABLED:-false}
      - LOG_USER_OPS_DIR=${LOG_USER_OPS_DIR:-/app/logs/user-ops}
      - LOG_RAG_ENABLED=${LOG_RAG_ENABLED:-false}
      - LOG_RAG_DIR=${LOG_RAG_DIR:-/app/logs/rag}
      - LOG_MAX_FILE_SIZE_MB=${LOG_MAX_FILE_SIZE_MB:-10}
      - LOG_MAX_BACKUP_FILES=${LOG_MAX_BACKUP_FILES:-5}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  candidate-worker:
    image: trap-map-server:latest
    profiles: ["distributed"]
    command: ["node", "dist/worker.js"]
    working_dir: /app/packages/server
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      - TRAPMAP_DATABASE_URL=postgres://trapmap:${POSTGRES_PASSWORD:-trapmap}@postgres:5432/trapmap
      - TRAPMAP_DEPLOYMENT_PROFILE=distributed
      - TRAPMAP_DEPLOYMENT_PRESET=candidate-worker
      - TRAPMAP_TASK_TRANSPORT=${TRAPMAP_TASK_TRANSPORT:-postgres}
      - TRAPMAP_RABBITMQ_URL=${TRAPMAP_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - TRAPMAP_RABBITMQ_TASK_EXCHANGE=${TRAPMAP_RABBITMQ_TASK_EXCHANGE:-trapmap.tasks}
      - TRAPMAP_RABBITMQ_TASK_QUEUE=${TRAPMAP_RABBITMQ_TASK_QUEUE:-trapmap.candidate}
      - TRAPMAP_RABBITMQ_PREFETCH=${TRAPMAP_RABBITMQ_PREFETCH:-4}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
        required: false
    healthcheck:
      disable: true
    restart: unless-stopped

  governance-worker:
    image: trap-map-server:latest
    profiles: ["distributed"]
    command: ["node", "dist/worker.js"]
    working_dir: /app/packages/server
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      - TRAPMAP_DATABASE_URL=postgres://trapmap:${POSTGRES_PASSWORD:-trapmap}@postgres:5432/trapmap
      - TRAPMAP_DEPLOYMENT_PROFILE=distributed
      - TRAPMAP_DEPLOYMENT_PRESET=governance-worker
      - TRAPMAP_TASK_TRANSPORT=${TRAPMAP_TASK_TRANSPORT:-postgres}
      - TRAPMAP_RABBITMQ_URL=${TRAPMAP_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      - TRAPMAP_RABBITMQ_TASK_EXCHANGE=${TRAPMAP_RABBITMQ_TASK_EXCHANGE:-trapmap.tasks}
      - TRAPMAP_RABBITMQ_TASK_QUEUE=${TRAPMAP_RABBITMQ_TASK_QUEUE:-trapmap.governance}
      - TRAPMAP_RABBITMQ_PREFETCH=${TRAPMAP_RABBITMQ_PREFETCH:-1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
        required: false
    healthcheck:
      disable: true
    restart: unless-stopped

  outbox-worker:
    image: trap-map-server:latest
    profiles: ["distributed"]
    command: ["node", "dist/worker.js"]
    working_dir: /app/packages/server
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4000
      - TRAPMAP_DATABASE_URL=postgres://trapmap:${POSTGRES_PASSWORD:-trapmap}@postgres:5432/trapmap
      - TRAPMAP_DEPLOYMENT_PROFILE=distributed
      - TRAPMAP_DEPLOYMENT_PRESET=outbox-worker
      - TRAPMAP_TASK_TRANSPORT=postgres
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: ["mq"]
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: trapmap-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: trapmap
      POSTGRES_USER: trapmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trapmap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trapmap -d trapmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
